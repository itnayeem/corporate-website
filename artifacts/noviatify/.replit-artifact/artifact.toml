kind = "web"
previewPath = "/"
title = "Noviatify"
version = "1.0.0"
id = "artifacts/noviatify"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23250

[services.development]
run = "pnpm --filter @workspace/noviatify run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/noviatify", "run", "build" ]
publicDir = "artifacts/noviatify/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23250"
BASE_PATH = "/"
